<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop Cart</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/home.css" />
  </head>
  <body>
    <div class="homePage">
      <!-- header -->
      <nav id="header">
        <div class="container">
          <div class="row">
            <div class="header-wrapper d-flex justify-content-between">
              <!-- we have made this div flex, with justify content as space justify-content-between -->
              <div class="logo d-inline-block">
                <a href="index.html" class="text-decoration-none">Shop Cart</a>
              </div>
              <div class="user-actions d-flex flex-row">
                <a href="cart.html">Cart</a>
                <div class="user-intro" id="userIntro">Hi User</div>
                <div class="logout-btn" id="logooutBtn">Logout</div>
              </div>
            </div>
          </div>
        </div>
      </nav>

      <!-- main content -->
      <div class="container">
        <div class="row">
          <h2 class="home-title text-center">Welcome to Shop Cart</h2>
          <div
            class="category-list d-flex flex-row justify-content-between align-items-center"
            id="categories"
          >
            <!-- List of categories -->

            <div
              class="category-item d-flex justify-content-center align-items-center"
            >
              <a href="">All products</a>
            </div>

            <div
              class="category-item d-flex justify-content-center align-items-center"
            >
              <a href="">Electronics</a>
            </div>

            <div
              class="category-item d-flex justify-content-center align-items-center"
            >
              <a href="">Kitchen Ware</a>
            </div>

            <div
              class="category-item d-flex justify-content-center align-items-center"
            >
              <a href="">Women Outfit</a>
            </div>

            <div
              class="category-item d-flex justify-content-center align-items-center"
            >
              <a href="">Sports</a>
            </div>
          </div>
          <div class="category-title text-center">
            Select a category to start Shopping
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
