<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart Page</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/cart.css" />
  </head>
  <body>
    <div id="cartPage">
      <!-- header -->
      <nav id="header">
        <div class="container">
          <div class="row">
            <div class="header-wrapper d-flex justify-content-between">
              <!-- we have made this div flex, with justify content as space justify-content-between -->
              <div class="logo d-inline-block">
                <a href="index.html" class="text-decoration-none">Shop Cart</a>
              </div>
              <div class="user-actions d-flex flex-row">
                <a href="cart.html">Cart</a>
                <div class="user-intro" id="userIntro">Hi User</div>
                <div class="logout-btn" id="logooutBtn">Logout</div>
              </div>
            </div>
          </div>
        </div>
      </nav>

      <div class="container">
        <div class="row">
          <h2 class="cart-title text-center">Your cart</h2>
          <div class="cart-wrapper d-flex flex-row">
            <div class="order-details d-flex flex-column" id="orderDetails">
              <!-- todo -->
              <div class="order-details-title fw-bold">Order Details</div>
              <div class="order-details-product d-flex flex-row">
                <div class="order-details-product-img d-flex">
                  <img src="img/product.jpg" alt="" />
                </div>
                <div
                  class="order-details-roduct-data d-flex flex-column justify-content-center"
                >
                  <div>Some product</div>
                  <div>&#8377; 10000</div>
                </div>
                <div class="order-details-product-actions d-flex flex-column">
                  <div class="order-details-product-quantity">
                    <div class="fw-bold">Quantity</div>
                    <div class="form-group">
                      <select name="" id="" class="form-select">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                      </select>
                    </div>
                  </div>
                  <div class="order-details-product-remove btn btn-danger">
                    Remove
                  </div>
                </div>
              </div>

              <!-- below products are copy-paste -->
              <hr />
              <div class="order-details-product d-flex flex-row">
                <div class="order-details-product-img d-flex">
                  <img src="img/product.jpg" alt="" />
                </div>
                <div
                  class="order-details-roduct-data d-flex flex-column justify-content-center"
                >
                  <div>Some product</div>
                  <div>&#8377; 10000</div>
                </div>
                <div class="order-details-product-actions d-flex flex-column">
                  <div class="order-details-product-quantity">
                    <div class="fw-bold">Quantity</div>
                    <div class="form-group">
                      <select name="" id="" class="form-select">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                      </select>
                    </div>
                  </div>
                  <div class="order-details-product-remove btn btn-danger">
                    Remove
                  </div>
                </div>
              </div>
              <hr />
              <div class="order-details-product d-flex flex-row">
                <div class="order-details-product-img d-flex">
                  <img src="img/product.jpg" alt="" />
                </div>
                <div
                  class="order-details-roduct-data d-flex flex-column justify-content-center"
                >
                  <div>Some product</div>
                  <div>&#8377; 10000</div>
                </div>
                <div class="order-details-product-actions d-flex flex-column">
                  <div class="order-details-product-quantity">
                    <div class="fw-bold">Quantity</div>
                    <div class="form-group">
                      <select name="" id="" class="form-select">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                      </select>
                    </div>
                  </div>
                  <div class="order-details-product-remove btn btn-danger">
                    Remove
                  </div>
                </div>
              </div>
            </div>
            <div class="order-details d-flex flex-column" id="priceDetails">
              <div class="price-details-box d-flex flex-column"></div>

              <!-- todo -->

              <div class="price-details-title fw-bold">Price Details</div>

              <div class="price-details-data">
                <div
                  class="price-details-item d-flex flex-row justify-content-between"
                >
                  <div>Price</div>
                  <div>&#8377; 10000</div>
                </div>
                <div
                  class="price-details-item d-flex flex-row justify-content-between"
                >
                  <div>Discount</div>
                  <div>&#8377; 10</div>
                </div>
                <div
                  class="price-details-item d-flex flex-row justify-content-between"
                >
                  <div>Delivery Carges</div>
                  <div>FREE</div>
                </div>
                <div
                  class="price-details-item d-flex flex-row justify-content-between"
                >
                  <div>Total Carges</div>
                  <div>&#8377; 9990</div>
                </div>
              </div>
              <div class="price-details-btn-group">
                <a
                  href="productList.html"
                  class="continue-shopping-btn btn btn-info text-decoration-none"
                  >Continue Shopping</a
                >
                <a
                  href="checkout.html"
                  class="continue-shopping-btn btn btn-primary text-decoration-none"
                  >Checkout</a
                >
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
